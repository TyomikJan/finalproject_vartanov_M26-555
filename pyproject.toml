[project]
name = "valutatrade_hub"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
authors = [{ name = "Artem Vartanov", email = "artemvartanov13@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]


[project.scripts]
project = "valutatrade_hub.cli.interface:main"
parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
exchange_rates_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
update_interval_seconds = 600
default_base_currency = "USD"
initial_balance = 10000.0
log_file = "logs/actions.log"
parser_log_file = "logs/parser.log"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 5
env_file = ".env"
